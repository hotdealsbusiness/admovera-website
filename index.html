<style>
:root{--paper:#fff;--cream:#fbf7ea;--line:#efe2b4;--gold1:#b8921a;--gold2:#7f5c00;--goldtxt:#8a6500;--ink:#14110a;--muted:#5a5444;--link:#0a6fe0;--ok:#1b7a43;--bad:#b3261e}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:'Roboto',system-ui,sans-serif;color:var(--ink);background:var(--paper);line-height:1.6}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--link);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.gold{background:linear-gradient(180deg,var(--gold1),var(--gold2));color:#fff;border:1px solid #6d4f00;border-radius:10px;font-weight:700;padding:11px 20px;box-shadow:0 3px 6px rgba(127,92,0,.35),inset 0 1px 0 rgba(255,255,255,.35);text-shadow:0 1px 1px rgba(0,0,0,.3);transition:filter .15s}
.gold:hover{filter:brightness(1.1)}
.ghost{background:#fff;color:var(--goldtxt);border:1.5px solid var(--gold1);border-radius:10px;font-weight:700;padding:11px 20px}
.ghost:hover{background:var(--cream)}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 6px 18px rgba(127,92,0,.08)}
header{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:76px}
.brand{display:flex;align-items:center;gap:12px;background:none;border:0;text-align:left}
.brand img{width:52px;height:52px;object-fit:contain}
.brand b{display:block;font-size:22px;font-weight:900;line-height:1}
.brand span{font-size:12px;font-weight:700;color:var(--goldtxt)}
nav{display:flex;gap:6px;align-items:center;flex:1;justify-content:center}
header .wrap{max-width:1360px}
nav .gold,nav a.gold,.right>.gold{white-space:nowrap}
a.gold{text-decoration:none;display:inline-block;line-height:1.6}
.right>.gold{padding:10px 20px}
nav .gold{padding:9px 13px;font-size:14px}
nav .gold.off{background:#fff;color:var(--ink);border-color:var(--line);box-shadow:none;text-shadow:none}
nav .gold.off:hover{background:var(--cream)}
.dd{position:relative}
.dd-menu{position:absolute;top:100%;left:0;width:340px;padding:8px;opacity:0;pointer-events:none;transform:translateY(6px);transition:.15s}
.dd:hover .dd-menu,.dd:focus-within .dd-menu{opacity:1;pointer-events:auto;transform:none}
.dd-menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 12px;border-radius:8px;font-weight:500;color:var(--ink)}
.dd-menu button:hover{background:var(--cream);color:var(--goldtxt)}
.right{display:flex;gap:10px;align-items:center}
.soc{display:flex;gap:6px}
.soc a{width:36px;height:36px;border-radius:50%;background:#fff;border:1px solid var(--line);box-shadow:0 2px 5px rgba(0,0,0,.08);display:grid;place-items:center;color:var(--ink)}
.soc svg{width:17px;height:17px;fill:currentColor}
.burger{display:none;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-weight:700}
.mnav{display:none}
.mnav .gold,.mnav a.gold{text-align:center}
form textarea{resize:vertical;min-height:90px}
.err{color:var(--bad);font-size:14px;margin:0 0 12px}
.hero{padding:64px 0 48px;background:linear-gradient(180deg,var(--cream),#fff)}
.hero .wrap{display:grid;grid-template-columns:1.25fr 1fr;gap:48px;align-items:center}
.badge{display:inline-block;border:1px solid var(--gold1);color:var(--goldtxt);background:#fff;border-radius:999px;padding:4px 14px;font-size:13px;font-weight:700;margin-bottom:18px}
h1{font-size:clamp(34px,5vw,56px);line-height:1.08;font-weight:900;letter-spacing:-.02em;margin-bottom:18px}
.lead{font-size:19px;color:var(--muted);max-width:560px;margin-bottom:28px}
.cta{display:flex;flex-wrap:wrap;gap:12px}
.logoCard{padding:28px;text-align:center}
.logoCard img{width:100%;max-width:340px}
.logoCard p{font-weight:700;color:var(--goldtxt);margin-top:6px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:40px}
.facts div{padding:16px 18px}
.facts b{display:block;font-size:20px;color:var(--goldtxt)}
.facts span{font-size:14px;color:var(--muted)}
section.pg{padding:56px 0}
h2{font-size:clamp(26px,3.5vw,38px);font-weight:900;letter-spacing:-.01em;margin-bottom:10px}
.sub{color:var(--muted);max-width:640px;margin-bottom:32px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:22px}
.svc{padding:26px;border-top:4px solid var(--gold1);display:flex;flex-direction:column;justify-content:space-between;gap:20px}
.svc h3{font-size:20px;line-height:1.3;margin:8px 0 14px}
.tag{font-size:13px;font-weight:700;color:var(--goldtxt)}
.svc li{list-style:none;margin-bottom:12px;font-size:15px}
.svc li b{display:block}
.svc li span{color:var(--muted);font-size:14px}
.calc{display:grid;grid-template-columns:1fr 1fr;gap:24px;padding:28px}
label{display:block;font-size:14px;font-weight:700;margin:0 0 6px}
input,select,textarea{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;font:inherit;margin-bottom:14px;background:#fff}
input:focus,select:focus,textarea:focus{border-color:var(--gold1);outline:none}
.res{background:var(--cream);border:1px solid var(--line);border-radius:12px;padding:22px}
.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.big{font-size:38px;font-weight:900;text-align:center;margin-top:18px}
.box{padding:32px;max-width:820px}
.box p{margin-bottom:14px;color:var(--muted)}
a.lnk{color:var(--link);font-weight:700;text-decoration:none}
a.lnk:hover{text-decoration:underline}
footer{border-top:1px solid var(--line);background:var(--cream);padding:30px 0;font-size:14px;color:var(--muted)}
footer .wrap{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:center}
footer .lk{display:flex;gap:18px;flex-wrap:wrap}
footer button{background:none;border:0;color:var(--link);font-weight:700}
.modal{position:fixed;inset:0;background:rgba(20,17,10,.55);display:grid;place-items:center;padding:16px;z-index:50}
.modal .card{max-width:440px;width:100%;padding:24px}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.x{background:none;border:0;font-size:28px;line-height:1}
@media(max-width:1280px){nav,.soc{display:none}.burger{display:block}.mnav{display:flex;flex-direction:column;gap:8px;padding:0 20px 16px}}

 .hero .wrap{grid-template-columns:1fr}.logoCard{order:-1;max-width:260px;margin:0 auto}

<div id="adm-cs">

<div class="hd">
<div class="bg">Case Study · Electronics · USA</div>
<h1>Turning Marketplace Data into <span>Sales Growth</span> and Account Protection</h1>
<p class="in">How listing optimization, error correction, and data analysis helped Hot Deals 4 Less grow sales, defend pricing, and catch risks to account health before they became problems.</p>
</div>

<div class="g g4">
<div class="fa"><small>Client</small><b>Hot Deals 4 Less</b></div>
<div class="fa"><small>Category</small><b>Electronics &amp; IT hardware</b></div>
<div class="fa"><small>Scope</small><b>20 sales channels</b></div>
<div class="fa"><small>Focus</small><b>Listings, sales &amp; account health</b></div>
</div>

<h2 class="st">Results at a Glance</h2>
<div class="g g4">
<div class="kp"><b>$2.64M</b><span>Sales tracked and analyzed</span></div>
<div class="kp"><b>59.8%</b><span>of monitored Amazon US items hold the Buy Box or are sole seller</span></div>
<div class="kp"><b>97.7%</b><span>of 5,852 audited listings were error-free</span></div>
<div class="kp"><b>0.48%</b><span>order defect rate, under Amazon's 1% target</span></div>
</div>

<h2 class="st">The Data Framework</h2>
<p class="ss">Every decision followed the same loop, from raw marketplace data to a specific action.</p>
<div class="fl">
<div class="fs"><h4><i class="fa-solid fa-database"></i>1. Collect</h4><p>Order feeds, pricing sheets, listing status, rank reports, and account dashboards across all channels.</p></div>
<div class="fs"><h4><i class="fa-solid fa-eye"></i>2. Monitor</h4><p>Daily checks on listings, Buy Box position, stock, and account metrics.</p></div>
<div class="fs"><h4><i class="fa-solid fa-magnifying-glass-chart"></i>3. Analyze</h4><p>Sales by channel and SKU, price gaps, defect types, and customer-experience health.</p></div>
<div class="fs"><h4><i class="fa-solid fa-bolt"></i>4. Act</h4><p>Correct listings, adjust prices, reserve stock, and shift effort to what converts.</p></div>
</div>

<h2 class="st">Part 1: Listing Optimization &amp; Error Correction</h2>
<p class="ss">Listings are where traffic turns into orders. They were created, checked, and fixed with data so that every product stayed visible, accurate, and ready to sell.</p>

<div class="g g3">
<div class="fs"><h4><i class="fa-solid fa-pen-nib"></i>Creation &amp; SEO</h4><p>New and existing listings were written with SEO-rich, customer-focused titles and descriptions, including Japanese-language content for Amazon Japan.</p></div>
<div class="fs"><h4><i class="fa-solid fa-store"></i>Platform-Specific Tuning</h4><p>eBay detail pages were tuned for Best Match, and Newegg listings were rebuilt with clear, benefit-led bullets. Each platform's search logic was respected.</p></div>
<div class="fs"><h4><i class="fa-solid fa-screwdriver-wrench"></i>Error Detection &amp; Correction</h4><p>Every published list was reviewed in a monitoring sheet. Errors were logged with evidence, then corrected or deleted, and the list was re-checked.</p></div>
</div>

<div class="cd">
<h3><i class="fa-solid fa-arrow-trend-up"></i>How Listing Quality Supports Sales</h3>
<div class="sb">Four conditions a listing must meet before it can sell, and where the data stands</div>
<div class="fl">
<div class="fs"><h4>1. Findable</h4><span class="big">SEO</span><p>Keyword-led titles and descriptions help shoppers find the product in marketplace search.</p></div>
<div class="fs"><h4>2. Convincing</h4><span class="big">98.4%</span><p>of 956 Amazon listings rated Excellent for customer-experience health.</p></div>
<div class="fs"><h4>3. Eligible</h4><span class="big">97.7%</span><p>of 5,852 audited listings were error-free, and only 1 of 169 monitored items was suppressed.</p></div>
<div class="fs"><h4>4. Competitive</h4><span class="big">59.8%</span><p>of 169 monitored Amazon US items hold the Buy Box or are the only seller.</p></div>
</div>
<div class="ins"><b>Insight:</b> A listing with an error can be suppressed, rejected, or mismatched with what the customer expects, and it stops earning sales until it is fixed. Finding and correcting those errors early protects revenue and keeps the catalog working for every channel.</div>
</div>

<h2 class="st">Part 2: Growing Sales with Data</h2>

<div class="cd">
<h3><i class="fa-solid fa-chart-line"></i>Where the Sales Come From</h3>
<div class="sb">Share of $2,644,984.58 by channel, with cumulative share</div>
<div class="sv"><svg viewBox="0 0 600 270" role="img" aria-label="Pareto chart of sales share by channel">

<g fill="#64748b" font-size="10"><text x="4" y="224">0%</text><text x="4" y="129">50%</text><text x="0" y="34">100%</text></g>

<p>JustSalma began with no brand history on Amazon, no listings, and no sales. Its seller page simply read &ldquo;Just launched, no feedback yet.&rdquo; The client also asked for growth without paid advertising, so every sale had to come from listings that rank on their own. That meant the store had to be built right the first time: approved brand, clean catalog, compliant listings, and a healthy account from day one.</p>
</div>

<h2 class="st">What We Built</h2>
<div class="g g3">
<div class="fs"><h4><i class="fa-solid fa-store"></i>Store &amp; Private-Label Brand</h4><p>Set up the seller account and registered JustSalma as a private-label brand in Amazon's system.</p></div>
<div class="fs"><h4><i class="fa-solid fa-pen-nib"></i>Search-Ready Listings</h4><p>Created listings that follow Amazon's current search and content guidelines, from titles to images to delivery options.</p></div>
<div class="fs"><h4><i class="fa-solid fa-file-circle-check"></i>Compliance &amp; Approvals</h4><p>Resolved approval and listing-creation errors, secured the GTIN exemption, and got a reviewed listing cleared to stay live.</p></div>
<div class="fs"><h4><i class="fa-solid fa-rotate-left"></i>Lost &amp; Returned Inventory</h4><p>Filed SAFE-T claims for goods not returned in original condition and won the reimbursements.</p></div>
<div class="fs"><h4><i class="fa-solid fa-heart-pulse"></i>Account Health</h4><p>Monitored every defect, delivery, and policy metric to keep the account free of violations.</p></div>
<div class="fs"><h4><i class="fa-solid fa-comments"></i>Customer Care</h4><p>Answered buyer questions quickly and backed each reply with tracking evidence.</p></div>
<div class="fs"><h4><i class="fa-solid fa-images"></i>A+ Content &amp; Brand Story</h4><p>Designed branded A+ pages that tell the JustSalma story and showcase the collection.</p></div>
<div class="fs"><h4><i class="fa-solid fa-tags"></i>Price &amp; Order Management</h4><p>Tracked prices, fees, payments, and returns on every order to protect margin and cash flow.</p></div>
</div>

      </div>

}
function CaseList({go}){

    <h2>Case studies</h2><p className="sub">Real work from real marketplace stores. Open a case to see the full data, charts and actions.</p>
    <div className="grid">{CASES.map(c=><div key={c.id} className="card svc">
      <div><span className="tag">{c.tag}</span><h3>{c.name}</h3><p style={{color:'var(--muted)',marginBottom:14}}>{c.line}</p>
        <div className="kpis">{c.stats.map((t,i)=><div key={i}><b>{t[0]}</b><span>{t[1]}</span></div>)}</div></div>

function CaseView({id,go}){

function About({go,setBook}){
  const ch=[['Getting Lost in the Noise','Products that do not rank in marketplace or search results stay invisible to buyers.'],['Low Conversions','Traffic reaches the store, but weak listings and offers fail to turn clicks into orders.'],['Operational Bottlenecks','Inventory mistakes, pricing errors, and scaling problems consume time and margin.'],['Keeping Up with Rules','Policy changes and account health issues can put an entire business at risk.']];
  const fw=[['Build a Strong Foundation','From search visibility to a smooth checkout, we focus on the steps that actually drive sales.'],['Work with the Algorithms','Whether it is a search engine or a marketplace, we show you how to structure product data so your listings get surfaced organically.'],['Streamline Backend Operations','Growth needs stability. We cover inventory syncing, pricing logic, and clean catalog management.'],['Focus on Customer Retention','A repeat customer is worth more than a one-time sale. We share strategies that build long-term trust and recurring revenue.']];
  const tp=[['Amazon Ads','how to prepare listings and structure campaigns before spending on PPC.'],['Listing optimization','titles, bullet points, backend search terms, and A+ content.'],['E-commerce strategy','planning, positioning, and avoiding costly early mistakes.'],['Operations and account health','inventory, pricing, returns, and policy compliance.']];
  return <section className="pg"><div className="wrap" style={{maxWidth:920}}>
    <div className="card hero2"><span className="badge">About Admovera</span><h1 style={{fontSize:'clamp(28px,4vw,40px)'}}>Practical E-Commerce Guidance for <span style={{color:'var(--goldtxt)'}}>Marketplace Sellers</span></h1>
      <p>Admovera is a resource for online sellers and brands growing on Amazon, Noon, eBay, Walmart, Etsy, and Shopify. You will find clear, hands-on guides on listing optimization, advertising, store operations, and e-commerce strategy.</p>
      <p><b style={{color:'var(--goldtxt)'}}>The goal is simple: help you make better decisions before you spend money on products, ads, or inventory.</b></p></div>
    <div className="card abc"><h2>Who Is Behind Admovera</h2><div className="who">
      <img src="https://blogger.googleusercontent.com/img/a/AVvXsEitcXnqQxh0uzEjXz27nH8sfkKdtQRqdI3kfn5hPhQ9HQ9WNlObWgQwi0r3MVvZanNVMsNgkKzeZDQeGFM1NRANBerXFR9GiX-gNS745Yo73lLWpAg8eYofz7cKXxvIoFy0sIB_7Ml119cbCIfAtvtlygvdnqnjPs8y8w2XgHLJx7vV4ZKDU7FjBryjGqE" alt="Ahmed Abdel Hameed, E-Commerce and Marketplace Consultant"/>
      <div style={{flex:1,minWidth:240}}><h3>Ahmed Abdel Hameed</h3><p style={{color:'var(--goldtxt)',fontWeight:700,marginBottom:10}}>Independent E-Commerce &amp; Marketplace Consultant</p>
        <p style={{color:'var(--muted)',marginBottom:10}}>I bring 20 years in sales, including 10 years of hands-on e-commerce sales management and operations. My work covers listing SEO, marketplace advertising, catalog and inventory management, and account health.</p>
        <p style={{color:'var(--muted)',marginBottom:14}}>I started Admovera to share what I learn from real marketplace work in a clear, practical format that sellers can apply right away.</p>
        <div className="cta"><a className="ghost" href="https://www.linkedin.com/in/admovera" target="_blank" rel="noreferrer">LinkedIn</a><a className="ghost" href="https://www.upwork.com/freelancers/~01dea80752edf481fd?mp_source=share" target="_blank" rel="noreferrer">Upwork</a><button className="ghost" onClick={()=>go('portfolio')}>Portfolio</button></div></div></div></div>
    <div className="card abc"><h2>The Challenges of Selling Online Today</h2><p style={{color:'var(--muted)'}}>Running an online business takes far more than listing products and waiting for sales. Most sellers run into the same four problems:</p>
      <div className="tiles">{ch.map((c,i)=><div key={i}><h4>{i+1}. {c[0]}</h4><p>{c[1]}</p></div>)}</div>
      <p className="ins" style={{marginTop:16}}><b>Each guide on Admovera is built around one of these problems, with steps you can apply to your own store.</b></p></div>
    <div className="card abc"><h2>What You Will Find Here</h2><div className="tiles">{tp.map((t,i)=><div key={i}><p><b>{t[0]}:</b> {t[1]}</p></div>)}</div>
      <p style={{marginTop:14,color:'var(--muted)'}}>Start with the <a className="lnk" href="https://admovera.blogspot.com/search/label/Amazon%20Ads%20for%20%20Beginner" target="_blank" rel="noreferrer">Amazon Ads guides</a> or the <a className="lnk" href="https://admovera.blogspot.com/search/label/E-Commerce%20Strategy" target="_blank" rel="noreferrer">E-Commerce Strategy articles</a>.</p></div>
    <div className="card abc"><h2>Mission and Vision</h2><div className="tiles"><div><h4>Our Mission</h4><p>To make e-commerce clearer for online sellers by sharing practical strategies they can use to build a sustainable business.</p></div><div><h4>Our Vision</h4><p>To become a trusted reference for sellers and brands growing across global marketplaces.</p></div></div></div>
    <div className="card abc"><h2>Our Framework &amp; Approach</h2><div className="tiles">{fw.map((f,i)=><div key={i}><h4>{i+1}. {f[0]}</h4><p>{f[1]}</p></div>)}</div></div>
    <div className="card abc"><h2>Editorial Transparency</h2><p style={{color:'var(--muted)',fontSize:14.5}}>Admovera content is written for educational purposes. Marketplace rules and algorithms change often, so always check the official platform documentation before making business decisions. This site may display advertising, and its use of cookies and data is explained in the <button style={{background:'none',border:0,color:'var(--link)',fontWeight:700,padding:0}} onClick={()=>go('privacy-policy')}>Privacy Policy</button>.</p></div>
    <div className="card hero2" style={{marginTop:22}}><h2>Need Help With Your Marketplace Store?</h2><p>Explore the consulting services or review my portfolio to see how I can support your growth.</p>
      <div className="cta" style={{justifyContent:'center',marginTop:16}}><button className="gold" onClick={()=>go('services')}>View Services</button><button className="ghost" onClick={()=>go('portfolio')}>See Portfolio</button><button className="ghost" onClick={()=>setBook(true)}>Contact Me</button></div></div>
  </div></section>;
}

const FEAT={n:'Amr Sami',r:'Amazon Seller',p:["My journey on Amazon started with several challenges, and I faced some issues due to my limited knowledge of Amazon policies. I suffered significant financial losses, and inventory worth nearly 50,000 was held.","While searching for a solution, I had the opportunity to meet Mr. Ahmed Abdelhamid. He stood out for his professionalism, integrity, and willingness to help and provide sincere advice.","With his guidance, I was able to start over and gain a much better understanding of Amazon policies and account management. Ahmed is truly knowledgeable in all aspects of Amazon accounts and always offers continuous support and valuable advice.","Thank you, Mr. Ahmed, for your support and guidance."]};
const TESTI=[
 ['Justsalma','Handcrafted Jewelry Brand',"Admovera provided end-to-end catalog optimization and structured backend keyword setups. Our handcrafted jewelry listings saw immediate indexation and conversion growth."],
 ['Senfineco','Oman & UAE Marketplaces',"Outstanding technical precision in managing automotive lubricant and spark plug listings. Fully compliant with Amazon's latest search algorithm updates."],
 ['Hot Deals 4 Less','USA Marketplace',"Handled complex multi-channel catalog issues and flat file variation troubleshooting seamlessly on Amazon US. Highly reliable e-commerce consulting."],
 ['Liquid Draft','KSA Marketplace',"Strategic listing copy and SEO execution tailored for the Saudi market. Admovera helped streamline our catalog lifecycle and operational metrics."],
 ['Wafa MED','KSA Marketplace',"Professional management of medical and healthcare category attributes. Precise backend search terms and listing optimization."],
 ['Gear 4 Less','USA Marketplace',"Excellent store management, buy-box strategies, and promotion management. Our account health and listings remain in top condition."],
 ['Zee Store','E-commerce Retail',"Deep expertise in Amazon seller central workflows, listing cleanup, and PPC efficiency. A true growth partner for marketplace operations."],
 ['GFM Egypt','Egypt Marketplace',"Comprehensive multi-channel e-commerce support. From listing creation to Amazon Easy Ship / FBA logistics optimization."]
];
const Who=({n,r})=><div className="au"><div className="av">{n[0]}</div><div><b>{n}</b><br/><span>{r}</span></div></div>;
const TCard=({t})=><div className="card tc"><p className="tq">“{t[2]}”</p><Who n={t[0]} r={t[1]}/></div>;
function Testimonials({go,setBook}){
  return <section className="pg"><div className="wrap" style={{maxWidth:960}}>
    <div className="card hero2"><span className="badge">Client Testimonials</span><h1 style={{fontSize:'clamp(28px,4vw,40px)'}}>Clients &amp; Brands <span style={{color:'var(--goldtxt)'}}>I've Worked With</span></h1>
      <p>Trusted by marketplace sellers, automotive brands, and e-commerce stores across the GCC, the US, and Egypt.</p></div>
    <div className="card fq" style={{marginTop:24}}><span className="badge">Featured Story</span>
      {FEAT.p.map((x,i)=><p key={i} style={{margin:'0 0 12px',color:'var(--muted)'}}>{x}</p>)}<Who n={FEAT.n} r={FEAT.r}/></div>
    <h2 style={{textAlign:'center',margin:'38px 0 22px'}}>What Brands Say</h2>
    <div className="grid">{TESTI.map((t,i)=><TCard key={i} t={t}/>)}</div>
    <div className="card hero2" style={{marginTop:38}}><h2>Want Similar Results for Your Store?</h2><p>Tell me about your store and your goals, and we can discuss the best next step.</p>
      <div className="cta" style={{justifyContent:'center',marginTop:16}}><button className="gold" onClick={()=>setBook(true)}>Contact Me</button><button className="ghost" onClick={()=>go('services')}>View Services</button><button className="ghost" onClick={()=>go('portfolio')}>See Portfolio</button></div></div>
  </div></section>;
}
function TestiHome({go}){
  return <section className="pg"><div className="wrap">
    <h2>What clients say</h2><p className="sub">Sellers and brands across the GCC, the US, and Egypt.</p>
    <div className="card fq" style={{marginBottom:22}}><p style={{fontSize:19,margin:0,color:'var(--ink)'}}>“With his guidance, I was able to start over and gain a much better understanding of Amazon policies and account management.”</p><Who n={FEAT.n} r={FEAT.r}/></div>
    <div className="grid">{[TESTI[0],TESTI[2],TESTI[5]].map((t,i)=><TCard key={i} t={t}/>)}</div>
    <div style={{marginTop:22}}><button className="gold" onClick={()=>go('testimonials')}>Read all testimonials</button></div>
  </div></section>;
}
function App(){
  const tab0 = () => { const h = window.location.hash.replace('#',''); return h === 'consultant' ? 'about-us' : (h || 'home'); };
  const [tab,setTab] = useState(tab0);
  const [book,setBook] = useState(false);
  const [menu,setMenu] = useState(false);
  const [sent,setSent] = useState(false);
  const [busy,setBusy] = useState(false);
  const [err,setErr] = useState(false);
  const submit = async e => {
    e.preventDefault(); setBusy(true); setErr(false);
    const body = Object.fromEntries(new FormData(e.target).entries());
    body._subject = 'Admovera inquiry: ' + body.topic; body._template = 'table'; body._captcha = 'false';
    try {
      const r = await fetch('https://formsubmit.co/ajax/admovera.spn@gmail.com',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(body)});
      const j = await r.json();
      if (r.ok && String(j.success) === 'true') setSent(true); else setErr(true);
    } catch (x) { setErr(true); }
    setBusy(false);
  };
  const [price,setPrice]=useState(45),[cogs,setCogs]=useState(14),[fba,setFba]=useState(8.5),[ads,setAds]=useState(7),[units,setUnits]=useState(1200);

  const go = (t,id=null) => {
    window.location.hash = t; setTab(t); setMenu(false);
    if(id) setTimeout(()=>{const e=document.getElementById(id); e && e.scrollIntoView({behavior:'smooth',block:'center'});},100); else window.scrollTo(0,0);
  };
  useEffect(()=>{ const f=()=>{setTab(tab0());window.scrollTo(0,0);}; window.addEventListener('hashchange',f); return()=>window.removeEventListener('hashchange',f); },[]);

  const unitCost = +cogs + +fba + +ads, profit = +price - unitCost;
  const margin = price>0 ? (profit/price*100).toFixed(1) : 0;
  const roas = ads>0 ? (price/ads).toFixed(2) : '0';
  const monthly = profit * units;

  const items = [['home','Home'],['services','Services'],['case-studies','Case Studies'],['calculator','ROI Calculator'],['about-us','About'],['portfolio','Portfolio'],['testimonials','Testimonials']];
  const Navbtn = ([k,l]) => <button key={k} className={'gold '+((tab===k||(k==='case-studies'&&tab.indexOf('case-')===0))?'':'off')} onClick={()=>go(k)}>{l}</button>;

  return (<>
  <header><div className="wrap">
    <div className="bar">
      <button className="brand" onClick={()=>go('home')} aria-label="Admovera home">
        <img src={LOGO} alt="Admovera compass logo"/><div><b>Admovera</b><span>Amazon SPN</span></div>
      </button>
      <nav aria-label="Main">
        <button className={'gold '+(tab==='home'?'':'off')} onClick={()=>go('home')}>Home</button>
        <div className="dd">
          <button className={'gold '+(tab==='services'?'':'off')} onClick={()=>go('services')}>Services ▾</button>
          <div className="card dd-menu">{services.map(s=><button key={s.id} onClick={()=>go('services',s.id)}>{s.short}</button>)}</div>
        </div>
        {items.slice(2).map(Navbtn)}
        <a className="gold off" href={BLOG} target="_blank" rel="noreferrer">Blog</a>
      </nav>
      <div className="right">
        <div className="soc">
          <a href={LINKEDIN} target="_blank" rel="noreferrer" aria-label="LinkedIn"><Icon d={IN}/></a>
          <a href={FACEBOOK} target="_blank" rel="noreferrer" aria-label="Facebook"><Icon d={FB}/></a>
        </div>
        <button className="gold" onClick={()=>setBook(true)}>Book consultation</button>
        <button className="burger" onClick={()=>setMenu(!menu)} aria-expanded={menu}>Menu</button>
      </div>
    </div>
    {menu && <div className="mnav">{items.map(Navbtn)}<a className="gold off" href={BLOG} target="_blank" rel="noreferrer">Blog</a><div className="mrow"><a className="gold off" href={LINKEDIN} target="_blank" rel="noreferrer">LinkedIn</a><a className="gold off" href={FACEBOOK} target="_blank" rel="noreferrer">Facebook</a></div><button className="gold" onClick={()=>{setMenu(false);setBook(true);}}>Book consultation</button></div>}
  </div></header>

  <main>
  {tab==='home' && <>
    <section className="hero"><div className="wrap">
      <div>
        <span className="badge">Amazon Service Provider (SPN)</span>
        <h1>Recover suspended Amazon accounts. Fix listings. Scale profitably.</h1>
        <p className="lead">Admovera helps Amazon sellers and brands recover suspended accounts, fix listing rejections, and stay compliant, then grow sales across Amazon and international marketplaces.</p>
        <div className="cta">
          <button className="gold" onClick={()=>setBook(true)}>Get help with my account</button>
          <button className="ghost" onClick={()=>go('calculator')}>Free profit calculator</button>
        </div>
        <div className="chips">{[['Compliance','compliance'],['Protection','amazon-account-management'],['Optimization','ebc-brand-store'],['Promotions','marketing-advertising'],['Operations','amazon-account-management'],['Training','training-mentorship']].map(c=><button key={c[0]} className="chip" onClick={()=>go('services',c[1])}>{c[0]}</button>)}</div>
      </div>
      <div className="card logoCard"><img src={LOGO} alt="Admovera: Guiding the way"/><p>Amazon SPN</p></div>
    </div>
    <div className="wrap facts">
      <div className="card"><b>Amazon SPN</b><span>Listed Amazon Service Provider</span></div>
      <div className="card"><b>+20 years in sales</b><span>Two decades of traditional sales expertise</span></div>
      <div className="card"><b>+10 years in e-commerce</b><span>End-to-end sales management and operations</span></div>
    </div></section>
    <section className="pg"><div className="wrap">
      <h2>What we fix and grow</h2><p className="sub">Five services, from daily account care to advertising and brand stores.</p>
      <div className="grid">{services.slice(0,3).map(s=><div key={s.id} className="card svc"><div><span className="tag">{s.tag}</span><h3>{s.title}</h3></div><button className="ghost" onClick={()=>go('services',s.id)}>See details</button></div>)}</div>
    </div></section>
    <Results go={go}/>
    <TestiHome go={go}/>
  </>}

  {tab==='services' && <section className="pg"><div className="wrap">
    <h2>Amazon growth services</h2><p className="sub">Data-driven solutions to protect your account, stay compliant, and build brand equity on Amazon.</p>
    <div className="grid">{services.map(s=>
      <div id={s.id} key={s.id} className="card svc">
        <div><span className="tag">{s.tag}</span><h3>{s.title}</h3>
          <ul>{s.hl.map((h,i)=><li key={i}><b>{h[0]}</b><span>{h[1]}</span></li>)}</ul></div>
        <button className="gold" onClick={()=>setBook(true)}>Get started</button>
      </div>)}</div>
  </div></section>}

  {tab==='calculator' && <section className="pg"><div className="wrap">
    <h2>Unit economics calculator</h2><p className="sub">Test your selling price, marketplace fees, and ad spend before you scale.</p>
    <div className="card calc">
      <div>
        <label htmlFor="p">Selling price ($)</label><input id="p" type="number" value={price} onChange={e=>setPrice(e.target.value)}/>
        <label htmlFor="c">Product cost ($)</label><input id="c" type="number" value={cogs} onChange={e=>setCogs(e.target.value)}/>
        <label htmlFor="f">Platform / FBA fees ($)</label><input id="f" type="number" value={fba} onChange={e=>setFba(e.target.value)}/>
        <label htmlFor="a">PPC ad spend per unit ($)</label><input id="a" type="number" value={ads} onChange={e=>setAds(e.target.value)}/>
        <label htmlFor="u">Monthly volume (units)</label><input id="u" type="number" value={units} onChange={e=>setUnits(e.target.value)}/>
      </div>
      <div className="res">
        <div className="row"><span>Total unit cost</span><b>${unitCost.toFixed(2)}</b></div>
        <div className="row"><span>Net profit per unit</span><b style={{color:profit>=0?'var(--ok)':'var(--bad)'}}>${profit.toFixed(2)}</b></div>
        <div className="row"><span>Net margin</span><b>{margin}%</b></div>
        <div className="row"><span>Break-even ROAS</span><b>{roas}x</b></div>
        <p style={{marginTop:18,fontSize:14,color:'var(--muted)'}}>Projected monthly net profit</p>
        <div className="big" style={{color:monthly>=0?'var(--ok)':'var(--bad)'}}>${monthly.toLocaleString()}</div>
      </div>
    </div>
  </div></section>}

  {tab==='about-us' && <About go={go} setBook={setBook}/>}
  {tab==='testimonials' && <Testimonials go={go} setBook={setBook}/>}

  {tab==='case-studies' && <CaseList go={go}/>}
  {tab.indexOf('case-')===0 && tab!=='case-studies' && <CaseView id={tab.slice(5)} go={go}/>}

  {tab==='portfolio' && <section className="pg"><div className="wrap"><div className="card box">
    <h2>Ahmed Abdel Hameed</h2><p className="sub" style={{marginBottom:14}}>Amazon e-commerce and marketplace consultant</p>
    <p>Specialized in driving digital revenue, listing optimization, and multi-channel scale strategies across Amazon, Noon, eBay, and Shopify.</p>
    <a className="lnk" href="https://admovera.blogspot.com/p/ahmed-abdel-hamid-professional.html" target="_blank" rel="noreferrer">View the full portfolio on the blog »</a>
  </div></div></section>}

  {tab==='privacy-policy' && <section className="pg"><div className="wrap"><div className="card box">
    <h2>Privacy policy</h2>
    <p>At Admovera, one of our main priorities is the privacy of our visitors.</p>
    <a className="lnk" href="https://admovera.blogspot.com/p/privacy-policy_01860821453.html" target="_blank" rel="noreferrer">Read the full policy »</a>
  </div></div></section>}
  </main>

  <footer><div className="wrap">
    <div className="lk">
      <a className="lnk" href={LINKEDIN} target="_blank" rel="noreferrer">LinkedIn</a>
      <a className="lnk" href={FACEBOOK} target="_blank" rel="noreferrer">Facebook</a>
      <a className="lnk" href={UPWORK} target="_blank" rel="noreferrer">Upwork</a>
      <a className="lnk" href={BLOG} target="_blank" rel="noreferrer">Blog</a>
      <button onClick={()=>go('privacy-policy')}>Privacy policy</button>
    </div>
    <p>© {new Date().getFullYear()} Admovera. All rights reserved. Amazon Service Provider (SPN)</p>
  </div></footer>

  {book && <div className="modal" role="dialog" aria-modal="true" aria-label="Book a consultation"><div className="card">
    <div className="mh"><h3>Book a consultation</h3><button className="x" onClick={()=>{setBook(false);setSent(false);setErr(false);}} aria-label="Close">&times;</button></div>
    {sent ? <p>Thanks, your inquiry was sent. We will reply by email.</p> :
    <form onSubmit={submit}>
      <label htmlFor="n">Full name</label><input id="n" name="name" required/>
      <label htmlFor="e">Email</label><input id="e" name="email" type="email" required placeholder="name@company.com"/>
      <label htmlFor="t">What do you need help with?</label>
      <select id="t" name="topic"><option>Account suspension / Plan of Action</option><option>Listing rejection</option><option>Compliance</option><option>Account management</option><option>Advertising (PPC)</option><option>Growth strategy</option><option>Other</option></select>
      <label htmlFor="m">Message</label><textarea id="m" name="message" placeholder="Tell us briefly about your case"/>
      <input type="text" name="_honey" style={{display:'none'}} tabIndex="-1" autoComplete="off"/>
      {err && <p className="err" role="alert">We could not send your message. Please try again or email <a className="lnk" href="mailto:amazon.spn@gmail.com">amazon.spn@gmail.com</a>.</p>}
      <button className="gold" type="submit" disabled={busy} style={{width:'100%'}}>{busy?'Sending...':'Send inquiry'}</button>
    </form>}
  </div></div>}
  </>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
