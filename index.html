<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ahmed Abdel Hameed - Advisory & Professional Portfolio</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            slate: {
              950: '#020617',
            }
          }
        }
      }
    }
  </script>
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen selection:bg-sky-500 selection:text-slate-950">

  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    function App() {
      const [activeTab, setActiveTab] = useState('consultant');
      const [bookingOpen, setBookingOpen] = useState(false);
      const [formSubmitted, setFormSubmitted] = useState(false);

      const linkedinUrl = "https://www.linkedin.com/in/ahmed-abdel-hameed-b2rstore/";
      const facebookUrl = "https://www.facebook.com/b2rstore";

      const handleFormSubmit = (e) => {
        e.preventDefault();
        setFormSubmitted(true);
        setTimeout(() => {
          setFormSubmitted(false);
          setBookingOpen(false);
        }, 2000);
      };

      return (
        <div class="min-h-screen flex flex-col justify-between">
          
          {/* Top Gradient Bar */}
          <div class="h-1.5 bg-gradient-to-r from-sky-500 via-blue-600 to-emerald-400 w-full"></div>

          {/* Navigation / Tabs Bar */}
          <header class="sticky top-0 z-40 bg-slate-950/80 backdrop-blur-md border-b border-slate-800/80 px-6 py-4">
            <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
              <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-sky-400 to-blue-600 flex items-center justify-center font-extrabold text-slate-950 shadow-lg shadow-sky-500/20">
                  AM
                </div>
                <div>
                  <h1 class="text-sm font-bold tracking-tight text-white">Ahmed Abdel Hameed</h1>
                  <p class="text-xs text-sky-400 font-medium">E-Commerce & Marketplace Consultant</p>
                </div>
              </div>

              {/* Tabs Switcher */}
              <div class="flex items-center bg-slate-900 p-1.5 rounded-2xl border border-slate-800 shadow-inner">
                <button
                  onClick={() => setActiveTab('consultant')}
                  class={`px-5 py-2 rounded-xl text-xs font-bold transition-all duration-300 ${
                    activeTab === 'consultant'
                      ? 'bg-sky-500 text-slate-950 shadow-md shadow-sky-500/25'
                      : 'text-slate-400 hover:text-white'
                  }`}
                >
                  Advisory & Services
                </button>
                <button
                  onClick={() => setActiveTab('portfolio')}
                  class={`px-5 py-2 rounded-xl text-xs font-bold transition-all duration-300 ${
                    activeTab === 'portfolio'
                      ? 'bg-sky-500 text-slate-950 shadow-md shadow-sky-500/25'
                      : 'text-slate-400 hover:text-white'
                  }`}
                >
                  Professional Portfolio
                </button>
              </div>

              <div class="hidden md:flex items-center space-x-3">
                <button 
                  onClick={() => setBookingOpen(true)}
                  class="bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold px-5 py-2.5 rounded-xl text-xs transition shadow-lg shadow-sky-500/20">
                  Request Consultation
                </button>
              </div>
            </div>
          </header>

          {/* Main Content Area */}
          <main class="max-w-5xl mx-auto px-6 py-10 w-full flex-grow">
            
            {/* CONSULTANT TAB */}
            {activeTab === 'consultant' && (
              <div class="space-y-12 animate-fadeIn">
                {/* Hero Section */}
                <section class="text-center space-y-6 py-8">
                  <div class="inline-flex items-center space-x-2 px-4 py-1.5 rounded-full bg-sky-500/10 border border-sky-500/20 text-sky-400 text-xs font-semibold">
                    <span>Senior E-Commerce Operations & Growth Strategy</span>
                  </div>
                  <h2 class="text-4xl md:text-5xl font-extrabold tracking-tight text-white max-w-3xl mx-auto leading-tight">
                    Scale Your Marketplace Sales with Precision Operations & Data Analytics
                  </h2>
                  <p class="text-base text-slate-400 max-w-2xl mx-auto leading-relaxed">
                    Over 10 years of specialized expertise in managing high-volume sales operations, inventory indexing, and paid ad strategies across Amazon, Noon, and global platforms.
                  </p>
                  <div class="flex justify-center gap-4 pt-4">
                    <button 
                      onClick={() => setBookingOpen(true)}
                      class="bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold px-8 py-3.5 rounded-2xl text-sm transition shadow-xl shadow-sky-500/20">
                      Book a Strategy Session
                    </button>
                    <a href="#details" class="bg-slate-900 hover:bg-slate-800 text-slate-200 border border-slate-800 font-semibold px-6 py-3.5 rounded-2xl text-sm transition">
                      Explore Services
                    </a>
                  </div>
                </section>

                {/* Core Expertise Cards */}
                <div id="details" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                  <div class="bg-slate-900/60 backdrop-blur border border-slate-800/80 rounded-3xl p-6 space-y-4 hover:border-sky-500/40 transition">
                    <div class="w-12 h-12 rounded-2xl bg-sky-500/10 flex items-center justify-center text-sky-400 font-bold">01</div>
                    <h3 class="text-lg font-bold text-white">Growth Hacking & SEO</h3>
                    <p class="text-xs text-slate-400 leading-relaxed">Advanced keyword indexing optimization, A+ content models, and targeted ad campaigns to maximize organic visibility and Buy Box share.</p>
                  </div>

                  <div class="bg-slate-900/60 backdrop-blur border border-slate-800/80 rounded-3xl p-6 space-y-4 hover:border-sky-500/40 transition">
                    <div class="w-12 h-12 rounded-2xl bg-sky-500/10 flex items-center justify-center text-sky-400 font-bold">02</div>
                    <h3 class="text-lg font-bold text-white">Account Audit & Recovery</h3>
                    <p class="text-xs text-slate-400 leading-relaxed">Comprehensive health checks, Plan of Action (POA) drafting for suspensions, policy compliance remediation, and Buy Box stabilization.</p>
                  </div>

                  <div class="bg-slate-900/60 backdrop-blur border border-slate-800/80 rounded-3xl p-6 space-y-4 hover:border-sky-500/40 transition">
                    <div class="w-12 h-12 rounded-2xl bg-sky-500/10 flex items-center justify-center text-sky-400 font-bold">03</div>
                    <h3 class="text-lg font-bold text-white">Supply Chain & Fulfillment</h3>
                    <p class="text-xs text-slate-400 leading-relaxed">Optimizing FBA/FBN logistics, inbound shipment planning, inventory turnover acceleration, and minimizing storage penalties.</p>
                  </div>
                </div>

                {/* Value Proposition */}
                <section class="bg-slate-900/40 border border-slate-800 rounded-3xl p-8 md:p-12 space-y-6">
                  <h3 class="text-2xl font-bold text-white text-center">Why Work With Me</h3>
                  <div class="grid md:grid-cols-2 gap-6">
                    <div class="flex items-start space-x-4">
                      <div class="p-2 bg-sky-500/10 text-sky-400 rounded-lg font-bold text-sm">✓</div>
                      <div>
                        <h4 class="text-sm font-bold text-white">Data-Driven Approach</h4>
                        <p class="text-xs text-slate-400">Decisions backed by sales velocity metrics, ROAS analytics, and search algorithm alignment.</p>
                      </div>
                    </div>
                    <div class="flex items-start space-x-4">
                      <div class="p-2 bg-sky-500/10 text-sky-400 rounded-lg font-bold text-sm">✓</div>
                      <div>
                        <h4 class="text-sm font-bold text-white">MENA & Global Marketplace Expertise</h4>
                        <p class="text-xs text-slate-400">Deep operational familiarity with Amazon (US, UAE, KSA, EG) and Noon regional dynamics.</p>
                      </div>
                    </div>
                  </div>
                </section>
              </div>
            )}

            {/* PORTFOLIO TAB */}
            {activeTab === 'portfolio' && (
              <div class="space-y-10 animate-fadeIn">
                <div class="border-b border-slate-800 pb-6">
                  <h2 class="text-3xl font-extrabold text-white">Professional Experience</h2>
                  <p class="text-xs text-slate-400 mt-2">10+ Years of E-Commerce Management, Listing Architecture, and Operations</p>
                </div>

                {/* Experience Cards */}
                <div class="space-y-6">
                  <div class="bg-slate-900/60 border border-slate-800 rounded-3xl p-6 space-y-3">
                    <div class="flex flex-col sm:flex-row justify-between sm:items-center gap-2">
                      <h3 class="text-base font-bold text-white">Senior E-Commerce & Marketplace Specialist</h3>
                      <span class="text-xs font-semibold px-3 py-1 rounded-full bg-slate-800 text-sky-400 w-fit">10+ Years Experience</span>
                    </div>
                    <p class="text-xs text-slate-300 leading-relaxed">
                      Leading multi-channel digital strategies across Amazon, Noon, and independent storefronts. Managed catalog indexing, product launches, advertising campaigns, and operational supply chains.
                    </p>
                    <div class="flex flex-wrap gap-2 pt-2">
                      <span class="text-[10px] px-2.5 py-1 bg-slate-800 text-slate-300 rounded-md">Amazon Seller Central</span>
                      <span class="text-[10px] px-2.5 py-1 bg-slate-800 text-slate-300 rounded-md">Noon Partner Station</span>
                      <span class="text-[10px] px-2.5 py-1 bg-slate-800 text-slate-300 rounded-md">ROAS Optimization</span>
                      <span class="text-[10px] px-2.5 py-1 bg-slate-800 text-slate-300 rounded-md">A+ Content</span>
                    </div>
                  </div>

                  <div class="bg-slate-900/60 border border-slate-800 rounded-3xl p-6 space-y-3">
                    <h3 class="text-base font-bold text-white">Catalog Optimization & Technical SEO</h3>
                    <p class="text-xs text-slate-300 leading-relaxed">
                      Executed structural optimization for technical hardware listings (e.g., Cisco switches, routers) complying with search ranking algorithms to maximize organic discoverability.
                    </p>
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* Footer */}
          <footer class="border-t border-slate-800/80 bg-slate-950 px-6 py-8">
            <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
              <p class="text-xs text-slate-500">© 2026 Ahmed Abdel Hameed. All rights reserved.</p>
              <div class="flex items-center space-x-4">
                <a href={linkedinUrl} target="_blank" rel="noopener noreferrer" class="text-slate-400 hover:text-sky-400 text-xs font-semibold transition">
                  LinkedIn
                </a>
                <a href={facebookUrl} target="_blank" rel="noopener noreferrer" class="text-slate-400 hover:text-sky-400 text-xs font-semibold transition">
                  Facebook Store
                </a>
              </div>
            </div>
          </footer>

          {/* Booking / Request Consultation Modal */}
          {bookingOpen && (
            <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm">
              <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 md:p-8 max-w-md w-full space-y-6 shadow-2xl relative">
                <button 
                  onClick={() => setBookingOpen(false)}
                  class="absolute top-4 right-4 text-slate-400 hover:text-white text-lg font-bold">
                  ✕
                </button>
                <div class="space-y-2">
                  <h3 class="text-xl font-bold text-white">Request Strategy Session</h3>
                  <p class="text-xs text-slate-400">Fill in your details to discuss your e-commerce growth strategy.</p>
                </div>

                {formSubmitted ? (
                  <div class="p-4 bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs rounded-xl text-center">
                    Thank you! Your request has been sent successfully.
                  </div>
                ) : (
                  <form onSubmit={handleFormSubmit} class="space-y-4">
                    <div>
                      <label class="block text-xs font-semibold text-slate-300 mb-1">Your Name</label>
                      <input type="text" required placeholder="John Doe" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-sky-500" />
                    </div>
                    <div>
                      <label class="block text-xs font-semibold text-slate-300 mb-1">Email Address</label>
                      <input type="email" required placeholder="name@company.com" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-sky-500" />
                    </div>
                    <div>
                      <label class="block text-xs font-semibold text-slate-300 mb-1">Project Details / Store Link</label>
                      <textarea rows="3" required placeholder="Tell me about your business goals..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-sky-500"></textarea>
                    </div>
                    <button type="submit" class="w-full bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold py-3 rounded-xl text-xs transition shadow-lg shadow-sky-500/20">
                      Submit Consultation Request
                    </button>
                  </form>
                )}
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
