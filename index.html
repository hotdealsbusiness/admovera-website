<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AdMovera | Amazon Service Provider (SPN)</title>
  <!-- React & Tailwind CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }

    /* تأثير الرفع مع الظل لجميع المربعات والبطاقات */
    .custom-hover-card {
      transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
    }
    .custom-hover-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 12px 24px -10px rgba(14, 165, 233, 0.25), 0 8px 16px -6px rgba(0, 0, 0, 0.5);
      border-color: rgba(56, 189, 248, 0.4) !important;
    }

    /* أنيميشن ناعم للقائمة المنسدلة */
    .dropdown-enter {
      opacity: 0;
      transform: translateY(10px) scale(0.95);
      pointer-events: none;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .group:hover .dropdown-enter {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased selection:bg-sky-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      // قراءة التبويب الحالي من الـ Hash في الرابط
      const getInitialTab = () => {
        const hash = window.location.hash.replace('#', '');
        return hash || 'home';
      };

      const [activeTab, setActiveTab] = useState(getInitialTab);

      const [price, setPrice] = useState(45);
      const [cogs, setCogs] = useState(14);
      const [fbaFee, setFbaFee] = useState(8.5);
      const [adSpendPerUnit, setAdSpendPerUnit] = useState(7);
      const [monthlyUnits, setMonthlyUnits] = useState(1200);
      const [bookingOpen, setBookingOpen] = useState(false);
      const [activeCategory, setActiveCategory] = useState('All');
      const [searchQuery, setSearchQuery] = useState('');

      // Social Links & Blogger
      const linkedinUrl = "https://www.linkedin.com/in/admovera";
      const facebookUrl = "https://www.facebook.com/aa.elhameed";
      const bloggerUrl = "https://admovera.blogspot.com/";

      const changeTab = (tabName, serviceId = null) => {
        window.location.hash = tabName;
        setActiveTab(tabName);

        if (serviceId) {
          setTimeout(() => {
            const element = document.getElementById(serviceId);
            if (element) {
              element.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
          }, 100);
        }
      };

      useEffect(() => {
        const handleHashChange = () => {
          const currentTab = window.location.hash.replace('#', '') || 'home';
          setActiveTab(currentTab);
        };

        window.addEventListener('hashchange', handleHashChange);
        return () => window.removeEventListener('hashchange', handleHashChange);
      }, []);

      const totalCostPerUnit = Number(cogs) + Number(fbaFee) + Number(adSpendPerUnit);
      const profitPerUnit = Number(price) - totalCostPerUnit;
      const netMargin = price > 0 ? ((profitPerUnit / price) * 100).toFixed(1) : 0;
      const totalMonthlyProfit = profitPerUnit * monthlyUnits;
      const roas = adSpendPerUnit > 0 ? (price / adSpendPerUnit).toFixed(2) : '0';

      // الخدمات المعدلة بالكامل بناءً على بيانات العرض المحدثة
      const services = [
        {
          id: "amazon-account-management",
          title: "Amazon Account Management",
          shortTitle: "Amazon Account Management",
          tag: "Operations & Health",
          highlights: [
            { label: "Comprehensive Operations", text: "Complete hands-on management of your day-to-day Seller Central dashboard." },
            { label: "Data-Driven Insights", text: "Regular performance tracking and analytics to unlock new growth opportunities." },
            { label: "Account Health Maintenance", text: "Proactive monitoring to protect account standing and resolve performance notifications." }
          ]
        },
        {
          id: "marketing-advertising",
          title: "Amazon Marketing & Advertising Optimization",
          shortTitle: "Marketing & Advertising Optimization",
          tag: "PPC & ROAS",
          highlights: [
            { label: "Strategic PPC Campaigns", text: "Expert setup and continuous management of Sponsored Products, Brands, and Display ads." },
            { label: "Profitability Focus", text: "Tailored strategies to drive down ACoS and lower TACoS for optimal ROI." },
            { label: "Promotions & Deals", text: "Creation and management of Lightning Deals, Coupons, and Prime Exclusive Discounts to boost velocity." }
          ]
        },
        {
          id: "compliance",
          title: "Compliance & Quality Assurance",
          shortTitle: "Compliance",
          tag: "Audits & Quality",
          highlights: [
            { label: "Regulatory Audits", text: "Thorough pre-listing audits to ensure compliance with marketplace laws and regulations." },
            { label: "Labeling & Packaging", text: "Clear guidance and verification for packaging, labeling, and hazardous material rules." },
            { label: "Global Readiness", text: "Quality assurance tailored to Amazon’s standards across various global marketplaces." }
          ]
        },
        {
          id: "ebc-brand-store",
          title: "Enhanced Brand Content (EBC/A+) & Store Creation",
          shortTitle: "Enhanced Brand Content & Store Creation",
          tag: "Brand Identity",
          highlights: [
            { label: "High-Converting A+ Content", text: "Custom visual layouts and persuasive messaging (up to 1,200 words) to enhance product listings." },
            { label: "Amazon Brand Store Design", text: "Immersive, multi-page store creation that showcases your full product catalog and builds brand loyalty." },
            { label: "Conversion Optimization", text: "Premium lifestyle imagery and graphics designed to drive higher click-through and conversion rates." }
          ]
        },
        {
          id: "training-mentorship",
          title: "Amazon Training & Mentorship",
          shortTitle: "Training & Mentorship",
          tag: "Education & Growth",
          highlights: [
            { label: "Certified Expertise", text: "Guidance delivered by Amazon-certified trainers with deep ecosystem knowledge." },
            { label: "Onboarding & Operations", text: "Step-by-step training on Seller Central registration, tools, and best operational practices." },
            { label: "Policy & Growth Strategy", text: "Clear explanation of complex Amazon policies and actionable strategies to scale independently." }
          ]
        }
      ];

      return (
        <div class="min-h-screen flex flex-col bg-slate-950 text-slate-100">
          {/* Header */}
          <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur-md sticky top-0 z-40">
            <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
              
              {/* Header Title & Subtitle Without Logo AM */}
              <div class="flex items-center cursor-pointer" onClick={() => changeTab('home')}>
                <div>
                  <span class="text-2xl font-extrabold tracking-tight block leading-none text-white">AdMovera</span>
                  <span class="text-[10px] uppercase tracking-widest text-sky-400 font-bold mt-1 block">Amazon Service Provider (SPN)</span>
                </div>
              </div>

              {/* Navigation Links with Hover Dropdown */}
              <nav class="hidden md:flex space-x-6 text-sm font-medium items-center">
                <button onClick={() => changeTab('home')} class={`transition ${activeTab === 'home' ? 'text-sky-400 font-bold border-b-2 border-sky-400 pb-1' : 'text-slate-300 hover:text-sky-400'}`}>Home</button>
                
                {/* Services Hover Dropdown */}
                <div class="relative group py-6">
                  <button onClick={() => changeTab('services')} class={`flex items-center space-x-1 transition ${activeTab === 'services' ? 'text-sky-400 font-bold border-b-2 border-sky-400 pb-1' : 'text-slate-300 hover:text-sky-400'}`}>
                    <span>Services</span>
                    <svg class="w-4 h-4 transition-transform group-hover:rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                    </svg>
                  </button>

                  {/* Dropdown Menu Items */}
                  <div class="absolute left-0 top-full w-72 bg-slate-900/95 border border-slate-800 backdrop-blur-xl rounded-2xl shadow-2xl p-2 dropdown-enter z-50">
                    <div class="px-3 py-2 text-[10px] font-bold uppercase tracking-wider text-slate-500 border-b border-slate-800/80 mb-1">
                      Our Amazon Solutions
                    </div>
                    {services.map((s) => (
                      <button
                        key={s.id}
                        onClick={() => changeTab('services', s.id)}
                        class="w-full text-left px-3 py-2.5 rounded-xl text-xs font-semibold text-slate-300 hover:text-sky-400 hover:bg-slate-800/60 transition flex items-center justify-between group/item"
                      >
                        <span>{s.shortTitle}</span>
                        <svg class="w-3.5 h-3.5 opacity-0 group-hover/item:opacity-100 transition-opacity text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                        </svg>
                      </button>
                    ))}
                  </div>
                </div>

                <button onClick={() => changeTab('calculator')} class={`transition ${activeTab === 'calculator' ? 'text-sky-400 font-bold border-b-2 border-sky-400 pb-1' : 'text-slate-300 hover:text-sky-400'}`}>ROI Calculator</button>
                <button onClick={() => changeTab('about-us')} class={`transition ${activeTab === 'about-us' ? 'text-sky-400 font-bold border-b-2 border-sky-400 pb-1' : 'text-slate-300 hover:text-sky-400'}`}>About Us</button>
                <button onClick={() => changeTab('privacy-policy')} class={`transition ${activeTab === 'privacy-policy' ? 'text-sky-400 font-bold border-b-2 border-sky-400 pb-1' : 'text-slate-300 hover:text-sky-400'}`}>Privacy Policy</button>
                <button onClick={() => changeTab('consultant')} class={`transition ${activeTab === 'consultant' ? 'text-sky-400 font-bold border-b-2 border-sky-400 pb-1' : 'text-slate-300 hover:text-sky-400'}`}>Consultant</button>
                <button onClick={() => changeTab('portfolio')} class={`transition ${activeTab === 'portfolio' ? 'text-sky-400 font-bold border-b-2 border-sky-400 pb-1' : 'text-slate-300 hover:text-sky-400'}`}>Portfolio</button>
              </nav>

              <div class="flex items-center space-x-4">
                {/* Social Icons */}
                <div class="hidden sm:flex items-center space-x-2 border-r border-slate-800 pr-4">
                  <a href={linkedinUrl} target="_blank" rel="noreferrer" class="p-2 bg-slate-800/80 hover:bg-sky-600/20 hover:text-sky-400 rounded-lg text-slate-300 transition" title="LinkedIn Profile">
                    <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.46 10.9v8.37H9.25V10.9H6.46M7.86 6.72a1.63 1.63 0 1 0 0 3.26 1.63 1.63 0 0 0 0-3.26Z"/></svg>
                  </a>
                  <a href={facebookUrl} target="_blank" rel="noreferrer" class="p-2 bg-slate-800/80 hover:bg-sky-600/20 hover:text-sky-400 rounded-lg text-slate-300 transition" title="Facebook Profile">
                    <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M22 12c0-5.52-4.48-10-10-10S2 6.48 2 12c0 4.84 3.44 8.87 8 9.8V15H7.5v-3H10V9.5C10 7.01 11.49 5.65 13.78 5.65c1.1 0 2.25.2 2.25.2v2.47h-1.27c-1.24 0-1.63.77-1.63 1.56V12h2.78l-.45 3h-2.33v6.8c4.56-.93 8-4.96 8-9.8z"/></svg>
                  </a>
                  <a href={bloggerUrl} target="_blank" rel="noreferrer" class="p-2 bg-slate-800/80 hover:bg-orange-600/20 hover:text-orange-400 rounded-lg text-slate-300 transition flex items-center justify-center" title="Blogger Blog">
                    <svg class="w-4 h-4 fill-current text-orange-500" viewBox="0 0 24 24">
                      <path d="M17.5 2H6.5C4.01 2 2 4.01 2 6.5v11C2 19.99 4.01 22 6.5 22h11c2.49 0 4.5-2.01 4.5-4.5v-11C22 4.01 19.99 2 17.5 2zM9.91 15.35H7.72V8.65h2.19c1.09 0 1.9.33 2.42.99.52.66.78 1.55.78 2.68 0 1.13-.26 2.02-.78 2.68-.52.66-1.33.95-2.42.95zm.51-5.18c-.29-.38-.72-.57-1.29-.57h-.61v3.35h.61c.57 0 1-.19 1.29-.57.29-.38.44-.92.44-1.61 0-.69-.15-1.23-.44-1.6zm6.36 5.18h-2.19V8.65h2.19v6.7z"/>
                    </svg>
                  </a>
                </div>

                <button onClick={() => setBookingOpen(true)} class="bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold px-5 py-2.5 rounded-xl text-sm transition shadow-md shadow-sky-500/10">
                  Book Consultation
                </button>
              </div>
            </div>
          </header>

          {/* Main Content Area */}
          <main class="flex-grow">
            {activeTab === 'home' && (
              <section class="py-24 px-6 relative overflow-hidden bg-gradient-to-b from-slate-900 via-slate-950 to-slate-950">
                <div class="max-w-4xl mx-auto text-center relative z-10">
                  <span class="inline-block bg-sky-500/10 border border-sky-500/20 text-sky-400 text-xs font-bold px-4 py-1.5 rounded-full mb-6">
                    Amazon Service Provider (SPN)
                  </span>
                  <h1 class="text-4xl sm:text-6xl font-extrabold text-white tracking-tight leading-tight mb-6">
                    Engineering Marketplace Dominance & Profitability
                  </h1>
                  <p class="text-slate-400 text-lg sm:text-xl max-w-3xl mx-auto mb-10 leading-relaxed font-normal">
                    We are an all-in-one Amazon E-commerce Service Provider dedicated to helping brands and sellers launch, optimize, and scale their businesses across Amazon marketplaces worldwide.
                  </p>
                  <div class="flex flex-wrap justify-center gap-4">
                    <button onClick={() => changeTab('services')} class="bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold px-8 py-4 rounded-xl text-sm transition shadow-lg shadow-sky-500/20">
                      Explore Our Services
                    </button>
                    <button onClick={() => changeTab('calculator')} class="bg-slate-900 hover:bg-slate-800 border border-slate-700 text-white font-semibold px-8 py-4 rounded-xl text-sm transition">
                      Calculate Unit Economics
                    </button>
                  </div>
                </div>
              </section>
            )}

            {activeTab === 'services' && (
              <section class="py-20 px-6 max-w-7xl mx-auto">
                <div class="text-center mb-16">
                  <span class="text-sky-400 text-xs font-bold uppercase tracking-widest bg-sky-500/10 border border-sky-500/20 px-4 py-1.5 rounded-full inline-block mb-3">Our Core Solutions</span>
                  <h2 class="text-3xl sm:text-4xl font-extrabold text-white mb-4">Professional Amazon Growth Services</h2>
                  <p class="text-slate-400 max-w-2xl mx-auto text-sm sm:text-base">Comprehensive, data-driven solutions engineered to maximize revenue, ensure full compliance, and build brand equity on Amazon.</p>
                </div>

                {/* Grid of Updated Detailed Services with Highlights */}
                <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-8">
                  {services.map((s, index) => (
                    <div id={s.id} key={s.id} class="bg-slate-900/70 border border-slate-800 p-8 rounded-3xl custom-hover-card flex flex-col justify-between relative overflow-hidden">
                      <div class="absolute top-0 right-0 w-32 h-32 bg-sky-500/5 rounded-full blur-2xl -mr-10 -mt-10 pointer-events-none"></div>
                      <div>
                        <div class="flex items-center justify-between mb-6">
                          <span class="text-xs font-bold text-sky-400 bg-sky-500/10 border border-sky-500/20 px-3 py-1 rounded-full">{s.tag}</span>
                          <span class="text-slate-600 text-xs font-mono font-bold">0{index + 1}</span>
                        </div>
                        <h3 class="font-bold text-xl text-white mb-6 leading-snug">{s.title}</h3>
                        
                        {/* Highlights List */}
                        <ul class="space-y-4 mb-8">
                          {s.highlights.map((h, i) => (
                            <li key={i} class="flex items-start space-x-3 text-sm">
                              <div class="mt-1 flex-shrink-0 w-4 h-4 rounded-full bg-sky-500/20 border border-sky-400/40 flex items-center justify-center">
                                <svg class="w-2.5 h-2.5 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" />
                                </svg>
                              </div>
                              <div class="text-slate-300">
                                <strong class="text-white font-semibold block mb-0.5">{h.label}</strong>
                                <span class="text-slate-400 text-xs leading-relaxed block">{h.text}</span>
                              </div>
                            </li>
                          ))}
                        </ul>
                      </div>

                      <button onClick={() => setBookingOpen(true)} class="w-full bg-slate-800/80 hover:bg-sky-500 hover:text-slate-950 text-sky-400 border border-slate-700/80 font-bold py-3 rounded-xl text-xs transition flex items-center justify-center space-x-2 group">
                        <span>Get Started with {s.shortTitle}</span>
                        <svg class="w-4 h-4 transition-transform group-hover:translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                        </svg>
                      </button>
                    </div>
                  ))}
                </div>
              </section>
            )}

            {activeTab === 'calculator' && (
              <section class="py-20 px-6 bg-slate-950">
                <div class="max-w-5xl mx-auto">
                  <div class="text-center mb-12">
                    <h2 class="text-3xl font-bold text-white mb-3">Interactive Unit Economics Calculator</h2>
                    <p class="text-slate-400">Simulate selling prices, marketplace fees, and PPC ad spend live.</p>
                  </div>
                  <div class="grid md:grid-cols-2 gap-8 bg-slate-900 border border-slate-800 p-8 rounded-3xl shadow-xl custom-hover-card">
                    <div class="space-y-5">
                      <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Selling Price ($)</label>
                        <input type="number" value={price} onChange={e => setPrice(e.target.value)} class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white font-bold focus:border-sky-500 focus:outline-none" />
                      </div>
                      <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Product COGS ($)</label>
                        <input type="number" value={cogs} onChange={e => setCogs(e.target.value)} class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white font-bold focus:border-sky-500 focus:outline-none" />
                      </div>
                      <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Platform / FBA Fees ($)</label>
                        <input type="number" value={fbaFee} onChange={e => setFbaFee(e.target.value)} class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white font-bold focus:border-sky-500 focus:outline-none" />
                      </div>
                      <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Target PPC Ad Spend / Unit ($)</label>
                        <input type="number" value={adSpendPerUnit} onChange={e => setAdSpendPerUnit(e.target.value)} class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white font-bold focus:border-sky-500 focus:outline-none" />
                      </div>
                      <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Estimated Monthly Volume (Units)</label>
                        <input type="number" value={monthlyUnits} onChange={e => setMonthlyUnits(e.target.value)} class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white font-bold focus:border-sky-500 focus:outline-none" />
                      </div>
                    </div>

                    <div class="bg-slate-950 border border-slate-800 rounded-2xl p-6 flex flex-col justify-between">
                      <div>
                        <h3 class="text-xs font-bold text-sky-400 uppercase tracking-widest mb-6">Financial Projections</h3>
                        <div class="space-y-4 text-sm">
                          <div class="flex justify-between border-b border-slate-800 pb-3">
                            <span class="text-slate-400">Total Unit Cost</span>
                            <span class="font-bold text-white">${totalCostPerUnit.toFixed(2)}</span>
                          </div>
                          <div class="flex justify-between border-b border-slate-800 pb-3">
                            <span class="text-slate-400">Net Profit / Unit</span>
                            <span class={`font-bold ${profitPerUnit >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>${profitPerUnit.toFixed(2)}</span>
                          </div>
                          <div class="flex justify-between border-b border-slate-800 pb-3">
                            <span class="text-slate-400">Net Margin</span>
                            <span class="font-bold text-sky-400">{netMargin}%</span>
                          </div>
                          <div class="flex justify-between border-b border-slate-800 pb-3">
                            <span class="text-slate-400">Target ROAS</span>
                            <span class="font-bold text-sky-400">{roas}x</span>
                          </div>
                        </div>
                      </div>
                      <div class="pt-6 border-t border-slate-800 text-center">
                        <span class="text-xs uppercase tracking-wider text-slate-400 block mb-1">Projected Monthly Net Profit</span>
                        <span class={`text-4xl font-extrabold ${totalMonthlyProfit >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>${totalMonthlyProfit.toLocaleString()}</span>
                      </div>
                    </div>
                  </div>
                </div>
              </section>
            )}

            {activeTab === 'about-us' && (
              <section class="py-20 px-6 bg-slate-950">
                <div class="max-w-5xl mx-auto space-y-16">
                  <div class="bg-slate-900 border-t-4 border-t-sky-500 border-x border-b border-slate-800 p-8 sm:p-10 rounded-3xl text-center space-y-4 shadow-xl custom-hover-card">
                    <h2 class="text-3xl sm:text-4xl font-extrabold text-white">Welcome to <span class="text-sky-400">Admovera</span></h2>
                    <p class="text-slate-300 leading-relaxed max-w-3xl mx-auto text-base sm:text-lg">
                      We are an all-in-one Amazon E-commerce Service Provider dedicated to helping brands and sellers launch, optimize, and scale their businesses across Amazon marketplaces worldwide. From daily operational management to high-converting marketing campaigns and regulatory compliance, our team of experts provides end-to-end solutions designed to maximize revenue, improve profitability, and build sustainable brand equity.
                    </p>
                  </div>
                </div>
              </section>
            )}

            {activeTab === 'privacy-policy' && (
              <section class="py-20 px-6 bg-slate-950">
                <div class="max-w-4xl mx-auto space-y-8">
                  <div class="bg-slate-900 border-t-4 border-t-sky-500 border-x border-b border-slate-800 p-8 sm:p-10 rounded-3xl text-center shadow-xl custom-hover-card">
                    <h1 class="text-3xl sm:text-4xl font-extrabold text-white mb-3">Privacy Policy</h1>
                    <p class="text-slate-400 text-sm sm:text-base max-w-2xl mx-auto leading-relaxed">
                      At <strong class="text-slate-200">Admovera</strong>, accessible from our website, one of our main priorities is the privacy of our visitors.
                    </p>
                  </div>
                </div>
              </section>
            )}

            {activeTab === 'consultant' && (
              <section class="py-20 px-6 bg-slate-950">
                <div class="max-w-3xl mx-auto text-center space-y-8 bg-slate-900/60 border border-slate-800 p-8 sm:p-12 rounded-3xl custom-hover-card">
                  <h2 class="text-3xl font-bold text-white">About Ahmed Abdel Hameed</h2>
                  <p class="text-slate-400 leading-relaxed text-base">
                    Independent E-Commerce & Amazon Marketplace Consultant with extensive commercial experience managing Seller Central operations, advertising performance, and compliance lifecycles.
                  </p>
                  <button onClick={() => setBookingOpen(true)} class="bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold px-8 py-3.5 rounded-xl text-sm transition">
                    Book Private Consultation
                  </button>
                </div>
              </section>
            )}

            {activeTab === 'portfolio' && (
              <section class="py-20 px-6 bg-slate-950">
                <div class="max-w-5xl mx-auto space-y-12">
                  <div class="bg-slate-900 border-t-4 border-t-sky-500 border-x border-b border-slate-800 p-8 sm:p-12 rounded-3xl text-center space-y-4 shadow-xl custom-hover-card">
                    <span class="inline-block bg-sky-500/10 border border-sky-500/20 text-sky-400 text-xs font-bold px-4 py-1.5 rounded-full">Professional Portfolio & Growth Strategy</span>
                    <h1 class="text-3xl sm:text-5xl font-extrabold text-white">Ahmed Abdel Hameed</h1>
                    <p class="text-sky-400 font-bold text-lg">Amazon E-Commerce & Marketplace Consultant</p>
                  </div>
                </div>
              </section>
            )}
          </main>

          {/* Footer */}
          <footer class="py-8 text-center text-xs text-slate-500 border-t border-slate-800 flex flex-col items-center justify-center space-y-4">
            <div class="flex space-x-6 text-slate-400">
              <a href={linkedinUrl} target="_blank" rel="noreferrer" class="hover:text-sky-400 transition">LinkedIn</a>
              <a href={facebookUrl} target="_blank" rel="noreferrer" class="hover:text-sky-400 transition">Facebook</a>
              <a href={bloggerUrl} target="_blank" rel="noreferrer" class="hover:text-orange-400 transition">Blogger</a>
              <button onClick={() => changeTab('privacy-policy')} class="hover:text-sky-400 transition">Privacy Policy</button>
            </div>
            <p>&copy; {new Date().getFullYear()} AdMovera. All rights reserved. | Amazon Service Provider (SPN)</p>
          </footer>

          {/* Modal */}
          {bookingOpen && (
            <div class="fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4 z-50">
              <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl">
                <div class="flex justify-between items-center mb-6">
                  <h3 class="font-bold text-white text-lg">Schedule Strategic Consultation</h3>
                  <button onClick={() => setBookingOpen(false)} class="text-slate-400 hover:text-white font-bold">&times;</button>
                </div>
                <form onSubmit={e => { e.preventDefault(); alert('Consultation inquiry sent successfully!'); setBookingOpen(false); }} class="space-y-4">
                  <div>
                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Full Name</label>
                    <input type="text" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-sky-500" placeholder="Ahmed Abdel Hameed" />
                  </div>
                  <div>
                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Work Email</label>
                    <input type="email" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-sky-500" placeholder="name@company.com" />
                  </div>
                  <button type="submit" class="w-full bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold py-3.5 rounded-xl text-sm transition">
                    Send Inquiry
                  </button>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
