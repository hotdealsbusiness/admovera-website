<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AdMovera | E-Commerce & Marketplace Growth Strategy</title>
  <!-- React & Tailwind CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased selection:bg-sky-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      // 1. قراءة التبويب الحالي من الـ Hash في الرابط (مثل #portfolio)
      const getInitialTab = () => {
        const hash = window.location.hash.replace('#', '');
        return hash || 'home';
      };

      const [activeTab, setActiveTab] = useState(getInitialTab);

      const [price, setPrice] = useState(45);
      const [cogs, setCogs] = useState(14);
      const [fbaFee, setFbaFee] = useState(8.5);
      const [adSpendPerUnit, setAdSpendPerUnit] = useState(7);
      const [monthlyUnits, setMonthlyUnits] = useState(1200);
      const [bookingOpen, setBookingOpen] = useState(false);
      const [activeCategory, setActiveCategory] = useState('All');
      const [searchQuery, setSearchQuery] = useState('');

      // Social Links
      const linkedinUrl = "https://www.linkedin.com/in/admovera";
      const facebookUrl = "https://www.facebook.com/aa.elhameed";

      // 2. تحديث التبويب والـ URL
      const changeTab = (tabName) => {
        window.location.hash = tabName;
        setActiveTab(tabName);
      };

      // 3. الاستماع لتغيرات الرابط عند استخدام أزرار Forward/Back
      useEffect(() => {
        const handleHashChange = () => {
          const currentTab = window.location.hash.replace('#', '') || 'home';
          setActiveTab(currentTab);
        };

        window.addEventListener('hashchange', handleHashChange);
        return () => window.removeEventListener('hashchange', handleHashChange);
      }, []);

      const totalCostPerUnit = Number(cogs) + Number(fbaFee) + Number(adSpendPerUnit);
      const profitPerUnit = Number(price) - totalCostPerUnit;
      const netMargin = price > 0 ? ((profitPerUnit / price) * 100).toFixed(1) : 0;
      const totalMonthlyProfit = profitPerUnit * monthlyUnits;
      const roas = adSpendPerUnit > 0 ? (price / adSpendPerUnit).toFixed(2) : '0';

      const services = [
        {
          title: "Amazon Search & Algorithm Strategy",
          desc: "Comprehensive organic indexing optimization for A9/A10 & COSMO intent architectures to drive non-branded search dominance.",
          tag: "Algorithm Engine"
        },
        {
          title: "PPC & TACOS Optimization",
          desc: "Structuring targeted Amazon Sponsored Ads, SBV, and DSP campaigns to maximize ROAS while maintaining healthy ad spend leverage.",
          tag: "Performance Ads"
        },
        {
          title: "Multi-Channel Store Operations",
          desc: "Full-lifecycle management across Amazon, Noon, eBay, Walmart, and Shopify with catalog compliance and inventory protection.",
          tag: "Marketplaces"
        },
        {
          title: "High-Converting Listing Assets",
          desc: "Mobile-first titles, persuasive bullet hierarchy, A+ Premium visual content, and backend search terms integration.",
          tag: "Conversion Labs"
        }
      ];

      const articles = [
        {
          title: "Understanding Amazon COSMO & Rufus AI Search Dynamics",
          cat: "Amazon SEO",
          read: "5 min read",
          desc: "How intent graphs and semantic search are replacing pure exact-match backend keywords in 2026."
        },
        {
          title: "Balancing ACOS vs TACOS for Sustainable Scale",
          cat: "PPC Strategy",
          read: "7 min read",
          desc: "Why aggressive PPC bids without organic conversion tracking burn margin and how to audit ad efficiency."
        },
        {
          title: "Expanding Store Operations: Amazon to Noon & Shopify",
          cat: "Multi-Channel",
          read: "6 min read",
          desc: "Key operational differences and catalog mapping strategies when diversifying beyond single marketplace dependencies."
        }
      ];

      const filtered = articles.filter(a => {
        const matchesCat = activeCategory === 'All' || a.cat === activeCategory;
        const matchesQuery = a.title.toLowerCase().includes(searchQuery.toLowerCase()) || a.desc.toLowerCase().includes(searchQuery.toLowerCase());
        return matchesCat && matchesQuery;
      });

      return (
        <div class="min-h-screen flex flex-col bg-slate-950 text-slate-100">
          {/* Header */}
          <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur-md sticky top-0 z-40">
            <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
              <div class="flex items-center space-x-3 cursor-pointer" onClick={() => changeTab('home')}>
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-sky-600 to-blue-500 flex items-center justify-center font-bold text-lg text-white shadow-lg shadow-sky-500/20">
                  AM
                </div>
                <div>
                  <span class="text-xl font-bold tracking-tight block leading-none">AdMovera</span>
                  <span class="text-[10px] uppercase tracking-widest text-sky-400 font-semibold">Consulting Firm</span>
                </div>
              </div>

              {/* Dynamic Navigation Links */}
              <nav class="hidden md:flex space-x-6 text-sm font-medium">
                <button 
                  onClick={() => changeTab('home')} 
                  class={`transition ${activeTab === 'home' ? 'text-sky-400 font-bold border-b-2 border-sky-400 pb-1' : 'text-slate-300 hover:text-sky-400'}`}>
                  Home
                </button>
                <button 
                  onClick={() => changeTab('services')} 
                  class={`transition ${activeTab === 'services' ? 'text-sky-400 font-bold border-b-2 border-sky-400 pb-1' : 'text-slate-300 hover:text-sky-400'}`}>
                  Services
                </button>
                <button 
                  onClick={() => changeTab('calculator')} 
                  class={`transition ${activeTab === 'calculator' ? 'text-sky-400 font-bold border-b-2 border-sky-400 pb-1' : 'text-slate-300 hover:text-sky-400'}`}>
                  ROI Calculator
                </button>
                <button 
                  onClick={() => changeTab('insights')} 
                  class={`transition ${activeTab === 'insights' ? 'text-sky-400 font-bold border-b-2 border-sky-400 pb-1' : 'text-slate-300 hover:text-sky-400'}`}>
                  Insights
                </button>
                <button 
                  onClick={() => changeTab('about-us')} 
                  class={`transition ${activeTab === 'about-us' ? 'text-sky-400 font-bold border-b-2 border-sky-400 pb-1' : 'text-slate-300 hover:text-sky-400'}`}>
                  About Us
                </button>
                <button 
                  onClick={() => changeTab('privacy-policy')} 
                  class={`transition ${activeTab === 'privacy-policy' ? 'text-sky-400 font-bold border-b-2 border-sky-400 pb-1' : 'text-slate-300 hover:text-sky-400'}`}>
                  Privacy Policy
                </button>
                <button 
                  onClick={() => changeTab('consultant')} 
                  class={`transition ${activeTab === 'consultant' ? 'text-sky-400 font-bold border-b-2 border-sky-400 pb-1' : 'text-slate-300 hover:text-sky-400'}`}>
                  Consultant
                </button>
                <button 
                  onClick={() => changeTab('portfolio')} 
                  class={`transition ${activeTab === 'portfolio' ? 'text-sky-400 font-bold border-b-2 border-sky-400 pb-1' : 'text-slate-300 hover:text-sky-400'}`}>
                  Portfolio
                </button>
              </nav>

              <div class="flex items-center space-x-4">
                <div class="hidden sm:flex items-center space-x-3 border-r border-slate-800 pr-4">
                  <a href={linkedinUrl} target="_blank" rel="noreferrer" class="p-2 bg-slate-800/80 hover:bg-sky-600/20 hover:text-sky-400 rounded-lg text-slate-300 transition" title="LinkedIn Profile">
                    <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.46 10.9v8.37H9.25V10.9H6.46M7.86 6.72a1.63 1.63 0 1 0 0 3.26 1.63 1.63 0 0 0 0-3.26Z"/></svg>
                  </a>
                  <a href={facebookUrl} target="_blank" rel="noreferrer" class="p-2 bg-slate-800/80 hover:bg-sky-600/20 hover:text-sky-400 rounded-lg text-slate-300 transition" title="Facebook Profile">
                    <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M22 12c0-5.52-4.48-10-10-10S2 6.48 2 12c0 4.84 3.44 8.87 8 9.8V15H7.5v-3H10V9.5C10 7.01 11.49 5.65 13.78 5.65c1.1 0 2.25.2 2.25.2v2.47h-1.27c-1.24 0-1.63.77-1.63 1.56V12h2.78l-.45 3h-2.33v6.8c4.56-.93 8-4.96 8-9.8z"/></svg>
                  </a>
                </div>

                <button 
                  onClick={() => setBookingOpen(true)}
                  class="bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold px-5 py-2.5 rounded-xl text-sm transition shadow-md shadow-sky-500/10">
                  Book Consultation
                </button>
              </div>
            </div>
          </header>

          {/* Main Content Area */}
          <main class="flex-grow">
            
            {/* 1. HOME TAB */}
            {activeTab === 'home' && (
              <section class="py-24 px-6 relative overflow-hidden bg-gradient-to-b from-slate-900 via-slate-950 to-slate-950">
                <div class="max-w-4xl mx-auto text-center relative z-10">
                  <span class="inline-block bg-sky-500/10 border border-sky-500/20 text-sky-400 text-xs font-bold px-4 py-1.5 rounded-full mb-6">
                    Independent E-Commerce & Marketplace Practice
                  </span>
                  <h1 class="text-4xl sm:text-6xl font-extrabold text-white tracking-tight leading-tight mb-6">
                    Engineering Marketplace Dominance & Profitability
                  </h1>
                  <p class="text-slate-400 text-lg sm:text-xl max-w-3xl mx-auto mb-10 leading-relaxed font-normal">
                    Your ultimate hub for actionable strategies, in-depth guides, and modern insights in E-Commerce, Digital Marketing, and Online Marketplaces.
                    <br/><br/>
                    Whether you are a beginner taking your first steps online, an established business owner looking to scale, or a marketing enthusiast aiming to stay ahead of the curve, AdMovera is built for you.
                  </p>
                  <div class="flex flex-wrap justify-center gap-4">
                    <button 
                      onClick={() => changeTab('portfolio')}
                      class="bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold px-8 py-4 rounded-xl text-sm transition shadow-lg shadow-sky-500/20">
                      View Full Portfolio
                    </button>
                    <button 
                      onClick={() => changeTab('calculator')}
                      class="bg-slate-900 hover:bg-slate-800 border border-slate-700 text-white font-semibold px-8 py-4 rounded-xl text-sm transition">
                      Calculate Unit Economics
                    </button>
                  </div>
                </div>
              </section>
            )}

            {/* 2. SERVICES TAB */}
            {activeTab === 'services' && (
              <section class="py-20 px-6 max-w-7xl mx-auto">
                <div class="text-center mb-16">
                  <h2 class="text-3xl font-bold text-white mb-3">Specialized Consultancy Modules</h2>
                  <p class="text-slate-400">Data-driven strategies built for high-margin e-commerce execution.</p>
                </div>
                <div class="grid md:grid-cols-2 lg:grid-cols-4 gap-6">
                  {services.map((s, i) => (
                    <div key={i} class="bg-slate-900/60 border border-slate-800 p-6 rounded-2xl hover:border-slate-700 transition">
                      <span class="text-xs font-bold text-sky-400 bg-sky-500/10 border border-sky-500/20 px-3 py-1 rounded-md inline-block mb-4">
                        {s.tag}
                      </span>
                      <h3 class="font-bold text-lg text-white mb-2">{s.title}</h3>
                      <p class="text-slate-400 text-sm leading-relaxed">{s.desc}</p>
                    </div>
                  ))}
                </div>
              </section>
            )}

            {/* 3. CALCULATOR TAB */}
            {activeTab === 'calculator' && (
              <section class="py-20 px-6 bg-slate-950">
                <div class="max-w-5xl mx-auto">
                  <div class="text-center mb-12">
                    <h2 class="text-3xl font-bold text-white mb-3">Interactive Unit Economics Calculator</h2>
                    <p class="text-slate-400">Simulate selling prices, marketplace fees, and PPC ad spend live.</p>
                  </div>

                  <div class="grid md:grid-cols-2 gap-8 bg-slate-900 border border-slate-800 p-8 rounded-3xl shadow-xl">
                    <div class="space-y-5">
                      <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Selling Price ($)</label>
                        <input type="number" value={price} onChange={e => setPrice(e.target.value)} class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white font-bold focus:border-sky-500 focus:outline-none" />
                      </div>
                      <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Product COGS ($)</label>
                        <input type="number" value={cogs} onChange={e => setCogs(e.target.value)} class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white font-bold focus:border-sky-500 focus:outline-none" />
                      </div>
                      <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Platform / FBA Fees ($)</label>
                        <input type="number" value={fbaFee} onChange={e => setFbaFee(e.target.value)} class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white font-bold focus:border-sky-500 focus:outline-none" />
                      </div>
                      <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Target PPC Ad Spend / Unit ($)</label>
                        <input type="number" value={adSpendPerUnit} onChange={e => setAdSpendPerUnit(e.target.value)} class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white font-bold focus:border-sky-500 focus:outline-none" />
                      </div>
                      <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Estimated Monthly Volume (Units)</label>
                        <input type="number" value={monthlyUnits} onChange={e => setMonthlyUnits(e.target.value)} class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white font-bold focus:border-sky-500 focus:outline-none" />
                      </div>
                    </div>

                    <div class="bg-slate-950 border border-slate-800 rounded-2xl p-6 flex flex-col justify-between">
                      <div>
                        <h3 class="text-xs font-bold text-sky-400 uppercase tracking-widest mb-6">Financial Projections</h3>
                        <div class="space-y-4 text-sm">
                          <div class="flex justify-between border-b border-slate-800 pb-3">
                            <span class="text-slate-400">Total Unit Cost</span>
                            <span class="font-bold text-white">${totalCostPerUnit.toFixed(2)}</span>
                          </div>
                          <div class="flex justify-between border-b border-slate-800 pb-3">
                            <span class="text-slate-400">Net Profit / Unit</span>
                            <span class={`font-bold ${profitPerUnit >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>${profitPerUnit.toFixed(2)}</span>
                          </div>
                          <div class="flex justify-between border-b border-slate-800 pb-3">
                            <span class="text-slate-400">Net Margin</span>
                            <span class="font-bold text-sky-400">{netMargin}%</span>
                          </div>
                          <div class="flex justify-between border-b border-slate-800 pb-3">
                            <span class="text-slate-400">Target ROAS</span>
                            <span class="font-bold text-sky-400">{roas}x</span>
                          </div>
                        </div>
                      </div>

                      <div class="pt-6 border-t border-slate-800 text-center">
                        <span class="text-xs uppercase tracking-wider text-slate-400 block mb-1">Projected Monthly Net Profit</span>
                        <span class={`text-4xl font-extrabold ${totalMonthlyProfit >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>
                          ${totalMonthlyProfit.toLocaleString()}
                        </span>
                      </div>
                    </div>
                  </div>
                </div>
              </section>
            )}

            {/* 4. INSIGHTS TAB */}
            {activeTab === 'insights' && (
              <section class="py-20 px-6 max-w-7xl mx-auto">
                <div class="text-center mb-12">
                  <h2 class="text-3xl font-bold text-white mb-3">Consulting Insights & Case Notes</h2>
                  <p class="text-slate-400">Analysis on search algorithms, ad leverage, and marketplace growth.</p>
                </div>

                <div class="flex flex-col sm:flex-row justify-between items-center gap-4 mb-8">
                  <input 
                    type="text" 
                    placeholder="Search articles..." 
                    value={searchQuery}
                    onChange={e => setSearchQuery(e.target.value)}
                    class="w-full sm:w-72 bg-slate-900 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-sky-500"
                  />
                  <div class="flex space-x-2">
                    {['All', 'Amazon SEO', 'PPC Strategy', 'Multi-Channel'].map(cat => (
                      <button 
                        key={cat}
                        onClick={() => setActiveCategory(cat)}
                        class={`px-3.5 py-1.5 rounded-lg text-xs font-semibold transition ${activeCategory === cat ? 'bg-sky-500 text-slate-950' : 'bg-slate-900 text-slate-400 hover:text-white'}`}>
                        {cat}
                      </button>
                    ))}
                  </div>
                </div>

                <div class="grid md:grid-cols-3 gap-6">
                  {filtered.map((item, idx) => (
                    <div key={idx} class="bg-slate-900/60 border border-slate-800 rounded-2xl p-6 flex flex-col justify-between">
                      <div>
                        <div class="flex justify-between text-xs text-slate-500 mb-3">
                          <span>{item.cat}</span>
                          <span>{item.read}</span>
                        </div>
                        <h3 class="font-bold text-white text-base mb-2">{item.title}</h3>
                        <p class="text-slate-400 text-sm leading-relaxed mb-4">{item.desc}</p>
                      </div>
                      <span class="text-xs font-semibold text-sky-400 hover:text-sky-300 cursor-pointer">Read Full Article &rarr;</span>
                    </div>
                  ))}
                </div>
              </section>
            )}

            {/* 5. ABOUT US TAB */}
            {activeTab === 'about-us' && (
              <section class="py-20 px-6 bg-slate-950">
                <div class="max-w-5xl mx-auto space-y-16">
                  <div class="overflow-hidden rounded-3xl border border-slate-800 shadow-2xl">
                    <a href="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgOmB0Us0BKed6hPZvik7GJYQBDgAdjQ_gXYJQZ6P5GutMLVXbBNCDAwIjPaXgyuKAaH4koQycd3MOo3YxdQRU3aWe2Ksn49VF8jB9XuEsvLwtgqMhxkViS_MDboSO8ebs5mpK9qpEjaGFwq_Sl6ErclricBRL-1Y3as-rshudd3sEuPAZiO4OPKLak2XU/s1169/Admover-%20about%20us.jpg" target="_blank">
                      <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgOmB0Us0BKed6hPZvik7GJYQBDgAdjQ_gXYJQZ6P5GutMLVXbBNCDAwIjPaXgyuKAaH4koQycd3MOo3YxdQRU3aWe2Ksn49VF8jB9XuEsvLwtgqMhxkViS_MDboSO8ebs5mpK9qpEjaGFwq_Sl6ErclricBRL-1Y3as-rshudd3sEuPAZiO4OPKLak2XU/s1600/Admover-%20about%20us.jpg" alt="Admovera About Us" class="w-full object-cover hover:scale-105 transition duration-500" />
                    </a>
                  </div>

                  <div class="bg-slate-900 border-t-4 border-t-sky-500 border-x border-b border-slate-800 p-8 sm:p-10 rounded-3xl text-center space-y-4 shadow-xl">
                    <h2 class="text-3xl sm:text-4xl font-extrabold text-white">Welcome to <span class="text-sky-400">Admovera</span>!</h2>
                    <p class="text-slate-300 leading-relaxed max-w-3xl mx-auto text-base sm:text-lg">
                      Building a successful online brand goes far beyond launching a website or putting products online. We are dedicated to guiding businesses with the best insights, strategies, and guides on Digital Marketing, SEO, Growth Hacking, and E-commerce Marketplace optimization to help them scale successfully.
                    </p>
                  </div>

                  <div class="bg-slate-900/80 border border-slate-800 p-8 sm:p-10 rounded-3xl space-y-6">
                    <h3 class="text-2xl font-bold text-white mb-2">The Challenges of Selling Online Today</h3>
                    <div class="grid sm:grid-cols-2 gap-4">
                      <div class="bg-slate-950/80 p-5 rounded-2xl border-l-4 border-sky-500 border-y border-r border-slate-800">
                        <h4 class="font-bold text-sky-400 text-base mb-1">1. Getting Lost in the Noise</h4>
                        <p class="text-slate-400 text-sm">Struggling to rank on search engines or marketplace results, leaving products unseen.</p>
                      </div>
                      <div class="bg-slate-950/80 p-5 rounded-2xl border-l-4 border-sky-500 border-y border-r border-slate-800">
                        <h4 class="font-bold text-sky-400 text-base mb-1">2. Low Conversions</h4>
                        <p class="text-slate-400 text-sm">Getting visitors to your store, but failing to turn those clicks into paying customers.</p>
                      </div>
                      <div class="bg-slate-950/80 p-5 rounded-2xl border-l-4 border-sky-500 border-y border-r border-slate-800">
                        <h4 class="font-bold text-sky-400 text-base mb-1">3. Operational Bottlenecks</h4>
                        <p class="text-slate-400 text-sm">Dealing with messy inventory, pricing errors, and scaling headaches that eat up your time.</p>
                      </div>
                      <div class="bg-slate-950/80 p-5 rounded-2xl border-l-4 border-sky-500 border-y border-r border-slate-800">
                        <h4 class="font-bold text-sky-400 text-base mb-1">4. Keeping Up with Rules</h4>
                        <p class="text-slate-400 text-sm">Fearing account health issues or sudden policy changes that put your business at risk.</p>
                      </div>
                    </div>
                  </div>
                </div>
              </section>
            )}

            {/* 6. PRIVACY POLICY TAB */}
            {activeTab === 'privacy-policy' && (
              <section class="py-20 px-6 bg-slate-950">
                <div class="max-w-4xl mx-auto space-y-8">
                  <div class="flex justify-center mb-6">
                    <a href="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgraHghaJ8dAKJjArZWeNRqR_kYEWWSFfeki36ZrRuR1hTVfepvevJu2wIRLew8QIcxqxjYk9AOuPJ5Qp0lefJQqVFsVciEWmecD6LLNSd6NT474XpoGvERz_b7ceYM7655TldrXtS8g_M38TO1K8tn9bz4zbrvQ5dsIcodsPHCmYVvVbnNvi9BsxB7nZM/s1024/Admovera%20Logo%20-%20facebook%20profile.jpeg" target="_blank" rel="noreferrer">

                    <div class="bg-slate-900/60 border border-slate-800 p-6 sm:p-8 rounded-2xl shadow-md">
                      <h3 class="text-xl font-bold text-white mb-1">4. Professional Training & Enablement</h3>
                      <div class="text-xs font-semibold text-sky-400 uppercase tracking-wider mb-6">Professional training and career development sessions</div>
                      <div class="space-y-4">
                        <div class="flex items-start space-x-3">
                          <div class="text-sky-400 mt-1 flex-shrink-0">
                            <svg class="w-5 h-5 stroke-current fill-none stroke-2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 14l9-5-9-5-9 5 9 5z"/><path stroke-linecap="round" stroke-linejoin="round" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0112 20.055a11.952 11.952 0 01-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z"/></svg>
                          </div>
                          <div>
                            <strong class="text-white text-sm">Team & Seller Coaching:</strong>
                            <p class="text-slate-400 text-sm mt-0.5">Integrated training programs for teams and new sellers to master e-commerce secrets on Amazon and other platforms.</p>
                          </div>
                        </div>
                        <div class="flex items-start space-x-3">
                          <div class="text-sky-400 mt-1 flex-shrink-0">
                            <svg class="w-5 h-5 stroke-current fill-none stroke-2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 01-2 2h-4a2 2 0 01-2-2v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg>
                          </div>
                          <div>
                            <strong class="text-white text-sm">Profitable Selling Strategies:</strong>
                            <p class="text-slate-400 text-sm mt-0.5">Detailed explanations of marketplace algorithms, profitable product research, and common store management mistakes to avoid.</p>
                          </div>
                        </div>
                        <div class="flex items-start space-x-3">
                          <div class="text-sky-400 mt-1 flex-shrink-0">
                            <svg class="w-5 h-5 stroke-current fill-none stroke-2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14 10h4.764a2 2 0 011.789 2.894l-3.5 7A2 2 0 0115.263 21h-4.017c-.163 0-.326-.02-.485-.06L7 20m7-10V5a2 2 0 00-2-2h-.095c-.5 0-.905.405-.905.905 0 .714-.211 1.412-.608 2.006L7 11v9m7-10h-2M7 20H5a2 2 0 01-2-2v-6a2 2 0 012-2h2.5"/></svg>
                          </div>
                          <div>
                            <strong class="text-white text-sm">Operational Empowerment:</strong>
                            <p class="text-slate-400 text-sm mt-0.5">Transferring practical expertise to ensure teams can independently run accounts and achieve revenue growth targets.</p>
                          </div>
                        </div>
                      </div>
                    </div>

                  </div>

                  {/* Contact CTA */}
                  <div class="bg-slate-900 border border-slate-800 p-8 sm:p-12 rounded-3xl text-center space-y-6 shadow-2xl">
                    <span class="inline-block bg-sky-500/10 border border-sky-500/20 text-sky-400 text-xs font-bold px-4 py-1.5 rounded-full">
                      Let's Connect
                    </span>
                    <h3 class="text-2xl sm:text-3xl font-extrabold text-white">Ready for Your Next Digital Success!</h3>
                    <p class="text-slate-400 text-sm sm:text-base max-w-xl mx-auto leading-relaxed">
                      Get in touch to maximize your e-commerce store revenue and streamline operations with data-driven strategies and proven expertise.
                    </p>
                    <div class="flex flex-wrap justify-center gap-4 pt-2">
                      <a href="mailto:b2rstore@outlook.com" class="bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold px-6 py-3.5 rounded-xl text-sm transition flex items-center space-x-2">
                        <svg class="w-4 h-4 fill-current" viewBox="0 0 20 20"><path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z"/><path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z"/></svg>
                        <span>b2rstore@outlook.com</span>
                      </a>
                      <a href="https://wa.me/201066551707" target="_blank" rel="noreferrer" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-6 py-3.5 rounded-xl text-sm transition flex items-center space-x-2">
                        <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981z"/></svg>
                        <span>+20 1066551707</span>
                      </a>
                    </div>
                  </div>

                </div>
              </section>
            )}

          </main>

          {/* Footer */}
          <footer class="py-8 text-center text-xs text-slate-500 border-t border-slate-800 flex flex-col items-center justify-center space-y-4">
            <div class="flex space-x-6 text-slate-400">
              <a href={linkedinUrl} target="_blank" rel="noreferrer" class="hover:text-sky-400 transition">LinkedIn</a>
              <a href={facebookUrl} target="_blank" rel="noreferrer" class="hover:text-sky-400 transition">Facebook</a>
              <button onClick={() => changeTab('privacy-policy')} class="hover:text-sky-400 transition">Privacy Policy</button>
            </div>
            <p>&copy; {new Date().getFullYear()} AdMovera. All rights reserved. | E-Commerce Strategy & Advisory</p>
          </footer>

          {/* Modal */}
          {bookingOpen && (
            <div class="fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4 z-50">
              <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl">
                <div class="flex justify-between items-center mb-6">
                  <h3 class="font-bold text-white text-lg">Schedule Strategic Consultation</h3>
                  <button onClick={() => setBookingOpen(false)} class="text-slate-400 hover:text-white font-bold">&times;</button>
                </div>
                <form onSubmit={e => { e.preventDefault(); alert('Consultation inquiry sent successfully!'); setBookingOpen(false); }} class="space-y-4">
                  <div>
                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Full Name</label>
                    <input type="text" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-sky-500" placeholder="Ahmed Abdel Hameed" />
                  </div>
                  <div>
                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Work Email</label>
                    <input type="email" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-sky-500" placeholder="name@company.com" />
                  </div>
                  <div>
                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Primary Marketplace</label>
                    <select class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-sky-500">
                      <option>Amazon</option>
                      <option>Noon</option>
                      <option>Shopify / D2C</option>
                      <option>eBay / Walmart</option>
                    </select>
                  </div>
                  <button type="submit" class="w-full bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold py-3.5 rounded-xl text-sm transition">
                    Send Inquiry
                  </button>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
